[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "causal-mix"
version = "0.1.0"
description = "A small, local CausalMix method demonstration"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch>=2.5,<3", "transformers>=4.46,<5", "peft>=0.14,<0.19",
  "datasets>=3,<5", "huggingface-hub>=0.28,<1", "econml==0.16.0",
  "lightgbm>=4.5,<5", "scikit-learn>=1.4,<1.7", "numpy>=1.26,<3",
  "pandas>=2,<3", "matplotlib>=3.8,<4", "pyyaml>=6", "pytest>=8,<10",
]

[project.scripts]
causal-mix = "causal_mix.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/causal_mix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
